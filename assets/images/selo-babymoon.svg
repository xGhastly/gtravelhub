<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000">
<defs>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&amp;family=Montserrat:wght@400;600&amp;display=swap');
    .serif-gold { font-family: 'Cinzel', 'Times New Roman', serif; font-size: 80px; fill: #d7ba81; font-weight: 700; letter-spacing: 6px; }
    .serif-white { font-family: 'Cinzel', 'Times New Roman', serif; font-size: 72px; fill: #ffffff; font-weight: 600; letter-spacing: 6px; }
  </style>
  <clipPath id="circle-clip">
    <circle cx="500" cy="500" r="500" />
  </clipPath>
</defs>
<g clip-path="url(#circle-clip)">
  <!-- Background -->
  <circle cx="500" cy="500" r="500" fill="#111427" />

  <!-- Top Icon: Luxury Babymoon (Stroller / Lotus / Warm Heart & Stars) -->
  <g id="babymoon-icon" transform="translate(500, 340)">
    <!-- Center elegant stroller silhouette -->
    <!-- Stroller hood -->
    <path d="M -90,-20 A 110,110 0 0,1 50,-130 L 50,-20 Z" fill="none" stroke="#d7ba81" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Stroller bassinet body -->
    <path d="M -100,-20 C -100,50 -20,80 40,80 C 90,80 120,40 120,-20 Z" fill="none" stroke="#d7ba81" stroke-width="16" stroke-linejoin="round"/>
    <!-- Handle -->
    <path d="M -95,-10 L -140,-90 C -145,-100 -135,-110 -125,-110 C -115,-110 -110,-100 -105,-90 L -75,-15" fill="none" stroke="#d7ba81" stroke-width="14" stroke-linecap="round"/>
    <!-- Wheels -->
    <circle cx="-45" cy="105" r="26" fill="none" stroke="#d7ba81" stroke-width="13"/>
    <circle cx="-45" cy="105" r="6" fill="#ffffff"/>
    <circle cx="65" cy="105" r="26" fill="none" stroke="#d7ba81" stroke-width="13"/>
    <circle cx="65" cy="105" r="6" fill="#ffffff"/>
    <!-- Chassis connectors -->
    <path d="M -45,105 L 10,20 L 65,105" fill="none" stroke="#d7ba81" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Delicate Heart inside bassinet -->
    <path d="M 10,-45 C 10,-55 22,-65 35,-55 C 48,-45 48,-30 35,-15 L 10,10 L -15,-15 C -28,-30 -28,-45 -15,-55 C -2,-65 10,-55 10,-45 Z" fill="#ffffff" transform="scale(0.7) translate(15, -40)"/>
    <!-- Sparkles / Stars -->
    <path d="M 130,-100 Q 140,-100 140,-110 Q 140,-100 150,-100 Q 140,-100 140,-90 Q 140,-100 130,-100 Z" fill="#d7ba81" transform="scale(1.4) translate(-20, -10)"/>
    <path d="M -150,-30 Q -140,-30 -140,-40 Q -140,-30 -130,-30 Q -140,-30 -140,-20 Q -140,-30 -150,-30 Z" fill="#d7ba81"/>
    <circle cx="170" cy="0" r="5" fill="#ffffff"/>
  </g>

  <!-- Typography: BABYMOON -->
  <g transform="translate(500, 710)" text-anchor="middle">
    <text y="0">
      <tspan class="serif-gold">B</tspan><tspan class="serif-white">ABYMOON</tspan>
    </text>
  </g>

  <!-- Bottom Divider with Airplane -->
  <g transform="translate(500, 850)">
    <!-- Left line -->
    <line x1="-240" y1="0" x2="-40" y2="0" stroke="#d7ba81" stroke-width="7" stroke-linecap="round"/>
    <!-- Right line -->
    <line x1="40" y1="0" x2="240" y2="0" stroke="#d7ba81" stroke-width="7" stroke-linecap="round"/>
    <!-- Airplane symbol -->
    <path d="M 0,-18 L 8,-6 L 30,-3 L 30,3 L 8,3 L 4,18 L -3,18 L -1,3 L -18,1 L -22,8 L -26,8 L -24,0 L -26,-8 L -22,-8 L -18,-1 L -1,-3 L -3,-18 Z" fill="#d7ba81" transform="rotate(90)"/>
  </g>
</g>
</svg>